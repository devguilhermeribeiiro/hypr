general {
    no_fade_in = false
    grace = 2
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 80
    position = 0, 200
    halign = center
    valign = center
}

label {
    text = $USER
    font_size = 20
    position = 0, -200
    halign = center
    valign = center
}

input-field {
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(151515)
    inner_color = rgb(202020)
    font_color = rgb(230,230,230)
    rounding = 12
    position = 0, -50
    halign = center
    valign = center
}
